<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuBly — Digital Business Card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap');

  :root{
    --pink:   #C6408F;
    --orange: #DB9142;
    --blue:   #8C8FE0;
    --green:  #4F9B5C;
    --cream:  #F6F0E1;
    --cream-deep: #ECE2CB;
    --envelope: #FDFCFA;
    --ink: #34302A;
    --ink-soft: #837A6C;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }

  body{
    font-family:'Inter', sans-serif;
    background:#FAF7F1;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------------- animated backdrop ---------------- */
  .backdrop{
    position:fixed; inset:0; z-index:0; overflow:hidden;
  }
  .blob{
    position:absolute; border-radius:50%;
    filter: blur(50px);
    opacity:0.5;
    animation: drift 22s ease-in-out infinite alternate;
  }
  .blob.b1{ width:38vw; height:38vw; left:-8vw; top:-6vw; background:var(--pink); opacity:0.16; animation-duration:26s; }
  .blob.b2{ width:34vw; height:34vw; right:-8vw; top:2vw; background:var(--orange); opacity:0.16; animation-duration:20s; animation-delay:-4s; }
  .blob.b3{ width:40vw; height:40vw; right:-10vw; bottom:-12vw; background:var(--blue); opacity:0.17; animation-duration:24s; animation-delay:-9s; }
  .blob.b4{ width:34vw; height:34vw; left:-6vw; bottom:-10vw; background:var(--green); opacity:0.16; animation-duration:19s; animation-delay:-2s; }

  @keyframes drift{
    0%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(3vw,-2vw) scale(1.08); }
    100%{ transform: translate(-2vw,3vw) scale(0.97); }
  }

  .dot{
    position:absolute; border-radius:50%;
    animation: floaty 7s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{ transform: translateY(0) translateX(0); }
    50%{ transform: translateY(-16px) translateX(6px); }
  }

  /* ---------------- layout ---------------- */
  .page{
    position:relative; z-index:1;
    height:100vh; width:100vw;
    display:flex; flex-direction:column;
    align-items:center; justify-content:space-between;
    padding: clamp(20px, 5vh, 48px) 16px;
  }

  .kicker{
    font-family:'Inter', sans-serif;
    font-size: 11.5px;
    font-weight:600;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    display:flex; align-items:center; gap:10px;
    opacity:0;
    animation: fadeDown .7s ease forwards .15s;
  }
  .kicker .swatch{
    display:inline-flex; gap:3px;
  }
  .kicker .swatch span{
    width:6px; height:6px; border-radius:50%;
  }
  .kicker .swatch span:nth-child(1){ background:var(--pink); }
  .kicker .swatch span:nth-child(2){ background:var(--orange); }
  .kicker .swatch span:nth-child(3){ background:var(--blue); }
  .kicker .swatch span:nth-child(4){ background:var(--green); }

  @keyframes fadeDown{
    from{ opacity:0; transform: translateY(-8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .center-wrap{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    width:100%;
  }

  .stage{
    --ew: clamp(280px, 42vw, 520px);
    --eh: calc(var(--ew) * 0.6);
    width: var(--ew);
    height: var(--eh);
    perspective: 2000px;
    cursor:pointer;
    position:relative;
    user-select:none;
    opacity:0;
    transform: scale(0.92);
    animation: introPop .8s cubic-bezier(.2,.8,.2,1) forwards .25s;
  }
  @keyframes introPop{
    to{ opacity:1; transform: scale(1); }
  }

  .float-wrap{
    width:100%; height:100%;
    transform-style: preserve-3d;
    animation: idleFloat 4s ease-in-out infinite;
  }
  .stage.busy .float-wrap{ animation:none; }
  @keyframes idleFloat{
    0%,100%{ transform: translateY(0) rotateZ(0deg); }
    50%{ transform: translateY(-8px) rotateZ(-0.5deg); }
  }

  .tilt-wrap{
    width:100%; height:100%;
    position:relative;
    transform-style: preserve-3d;
    transition: transform .35s ease;
  }

  /* Unclipped layer for the card, positioned over the envelope but not
     confined by the .face overflow:hidden that clips the flap/back */
  .card-holder{
    position:absolute; inset:0;
    z-index:5;
    pointer-events:none;
  }

  .envelope{
    width:100%; height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition: transform 0.95s cubic-bezier(.65,0,.35,1);
  }
  .envelope.flip{ transform: rotateY(180deg); }

  .ground-shadow{
    position:absolute;
    left:50%; bottom:-14%;
    width:78%; height:22px;
    background: radial-gradient(closest-side, rgba(60,45,20,0.28), transparent 75%);
    transform: translateX(-50%);
    filter: blur(2px);
    transition: opacity .4s ease, transform .4s ease;
    z-index:-1;
  }
  .stage.busy .ground-shadow{ opacity:0.6; transform: translateX(-50%) scale(0.92); }

  .face{
    position:absolute; inset:0;
    border-radius: 12px;
    backface-visibility: hidden;
    box-shadow: 0 22px 46px -16px rgba(60,45,20,0.30), 0 3px 8px rgba(60,45,20,0.10);
    overflow:hidden;
  }

  /* ---------- FRONT ---------- */
  .front{
    background: var(--envelope);
    display:flex; align-items:center; justify-content:center;
    border:1px solid #EFEAE0;
  }
  .front .shine{
    position:absolute; top:0; bottom:0; left:-60%;
    width:40%;
    background: linear-gradient(75deg, transparent, rgba(255,255,255,0.55), transparent);
    animation: sweep 5.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sweep{
    0%{ left:-60%; }
    35%,100%{ left:130%; }
  }
  .front::before{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:7px;
    background: linear-gradient(90deg, var(--pink) 0 25%, var(--orange) 25% 50%, var(--blue) 50% 75%, var(--green) 75% 100%);
    opacity:0.9;
  }
  .front img{
    width:54%;
    max-width:260px;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.07));
    position:relative; z-index:1;
  }

  /* ---------- BACK ---------- */
  .back{
    background: var(--envelope);
    transform: rotateY(180deg);
    border:1px solid #EFEAE0;
  }
  .back .inner{
    position:absolute; inset:0;
    background: linear-gradient(180deg, var(--cream-deep), var(--cream));
    opacity:0;
    transition: opacity .4s ease .55s;
  }
  .envelope.flip .back .inner{ opacity:1; }

  .flap{
    position:absolute;
    top:0; left:0; width:100%; height:64%;
    background: var(--envelope);
    clip-path: polygon(0% 0%, 100% 0%, 50% 92%);
    transform-origin: top center;
    transform: rotateX(0deg);
    transition: transform 0.6s cubic-bezier(.5,0,.3,1.4);
    z-index:3;
  }
  .flap.open{ transform: rotateX(-170deg); }

  .seal{
    position:absolute;
    top:56%; left:50%;
    width:38px; height:38px;
    border-radius:50%;
    transform: translate(-50%,-50%);
    background: conic-gradient(var(--pink), var(--orange), var(--blue), var(--green), var(--pink));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    z-index:4;
    transition: opacity .25s ease, transform .25s ease;
  }
  .seal::before{
    content:"B";
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size:17px;
    color:#fff;
    background: var(--ink);
    width:29px; height:29px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .flap.open .seal{ opacity:0; transform: translate(-50%,-50%) scale(0.4) rotate(90deg); }

  /* ---------- burst particles ---------- */
  .burst{
    position:absolute; top:56%; left:50%; width:0; height:0; z-index:6; pointer-events:none;
  }
  .burst span{
    position:absolute; top:0; left:0;
    width:6px; height:6px; border-radius:50%;
    opacity:0;
    transform: translate(-50%,-50%);
  }
  .burst.go span{
    animation: fly 0.9s cubic-bezier(.2,.7,.3,1) forwards;
    animation-delay: var(--d);
  }
  @keyframes fly{
    0%{ opacity:1; transform: translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0.4); }
  }

  /* ---------- CARD ---------- */
  .card{
    position:absolute;
    left:50%; bottom:8%;
    width:88%;
    height:80%;
    transform: translate(-50%, 10%) scale(0.8) rotateZ(-2deg);
    opacity:0;
    background: var(--cream);
    border-radius:10px;
    box-shadow: 0 18px 36px -12px rgba(60,45,20,0.38);
    pointer-events: none;
    transition: transform 0.6s cubic-bezier(.24,1.6,.4,1) 0s, opacity 0.4s ease 0s;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding: clamp(16px, 3.6vw, 26px) clamp(18px, 4.2vw, 30px);
    border:1px solid #E9DFC7;
  }
  .card::after{
    content:"";
    position:absolute; top:0; right:0;
    width:0; height:0;
    border-style:solid;
    border-width: 0 16px 16px 0;
    border-color: transparent var(--cream-deep) transparent transparent;
  }
  .card.show{
    transform: translate(-50%, -44%) scale(1) rotateZ(0deg);
    opacity:1;
    pointer-events: auto;
  }

  .card .accent-line{
    width:36px; height:3px;
    border-radius:2px;
    background: linear-gradient(90deg, var(--pink), var(--orange), var(--blue), var(--green));
    margin-bottom:12px;
    transform: scaleX(0);
    transform-origin:left;
    transition: transform .5s ease .35s;
  }
  .card.show .accent-line{ transform: scaleX(1); }

  .card .row{
    opacity:0;
    transform: translateY(6px);
    transition: opacity .45s ease var(--rd, .4s), transform .45s ease var(--rd, .4s);
  }
  .card.show .row{ opacity:1; transform: translateY(0); }

  .card .name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: clamp(18px, 3.2vw, 24px);
    color: var(--ink);
    line-height:1.15;
    margin:0 0 2px 0;
  }
  .card .title{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size: clamp(11px, 1.8vw, 13px);
    color: var(--ink-soft);
    letter-spacing:.02em;
    margin:0 0 14px 0;
  }

  .card .field{
    display:flex; align-items:baseline; gap:8px;
    font-size: clamp(11px, 1.8vw, 13px);
    color: var(--ink);
    margin:4px 0;
  }
  .card .field .label{
    color: var(--ink-soft);
    font-size: 0.85em;
    min-width: 48px;
  }

  .card .brand{
    position:absolute; right:16px; bottom:12px;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size:12px;
    letter-spacing:.03em;
    color: var(--ink-soft);
    opacity:.65;
  }

  .hint{
    font-family:'Inter', sans-serif;
    font-size: 12px;
    font-weight:500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity:0;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    animation: fadeUp .7s ease forwards .5s;
  }
  .hint.hidden{ opacity:0 !important; transition: opacity .3s ease; }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:0.75; transform: translateY(0); }
  }
  .hint .arrow{
    width:14px; height:14px;
    border-right:2px solid var(--ink-soft);
    border-bottom:2px solid var(--ink-soft);
    transform: rotate(45deg);
    animation: bounce 1.6s ease-in-out infinite;
    opacity:0.7;
  }
  @keyframes bounce{
    0%,100%{ transform: rotate(45deg) translate(0,0); }
    50%{ transform: rotate(45deg) translate(4px,4px); }
  }

  @media (prefers-reduced-motion: reduce){
    .float-wrap, .hint, .hint .arrow, .blob, .dot, .front .shine, .stage{ animation:none !important; }
  }
</style>
</head>

<script>
  const stage = document.getElementById('stage');
  const tiltWrap = document.getElementById('tiltWrap');
  const envelope = document.getElementById('envelope');
  const flap = document.getElementById('flap');
  const card = document.getElementById('card');
  const hint = document.getElementById('hint');
  const hintText = document.getElementById('hintText');
  const burst = document.getElementById('burst');

  const COLORS = ['#C6408F', '#DB9142', '#8C8FE0', '#4F9B5C'];

  function spawnBurst(){
    burst.innerHTML = '';
    const count = 16;
    for(let i=0;i<count;i++){
      const s = document.createElement('span');
      const angle = (Math.PI * 2 * i) / count + (Math.random()*0.3 - 0.15);
      const dist = 46 + Math.random()*30;
      const x = Math.cos(angle) * dist;
      const y = Math.sin(angle) * dist - 10;
      s.style.setProperty('--x', x + 'px');
      s.style.setProperty('--y', y + 'px');
      s.style.setProperty('--d', (Math.random()*0.15) + 's');
      s.style.background = COLORS[i % COLORS.length];
      burst.appendChild(s);
    }
    requestAnimationFrame(()=>{
      burst.classList.add('go');
    });
  }
  function clearBurst(){
    burst.classList.remove('go');
    burst.innerHTML = '';
  }

  let state = 'closed';
  let animating = false;

  function openSequence(){
    animating = true;
    stage.classList.add('busy');
    hint.classList.add('hidden');
    envelope.classList.add('flip');
    setTimeout(()=>{ flap.classList.add('open'); spawnBurst(); }, 680);
    setTimeout(()=>{ card.classList.add('show'); }, 1120);
    setTimeout(()=>{
      animating = false; state = 'open';
      hintText.textContent = 'Tap to close';
      hint.classList.remove('hidden');
    }, 1750);
  }

  function closeSequence(){
    animating = true;
    hint.classList.add('hidden');
    card.classList.remove('show');
    setTimeout(()=>{ flap.classList.remove('open'); clearBurst(); }, 480);
    setTimeout(()=>{ envelope.classList.remove('flip'); }, 980);
    setTimeout(()=>{
      animating = false;
      state = 'closed';
      stage.classList.remove('busy');
      hintText.textContent = 'Tap to open';
      hint.classList.remove('hidden');
    }, 1800);
  }

  function toggle(){
    if(animating) return;
    if(state === 'closed') openSequence();
    else closeSequence();
  }

  stage.addEventListener('click', toggle);
  stage.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      toggle();
    }
  });

  // subtle parallax tilt on pointer move (closed state, desktop)
  function handleMove(e){
    if(state !== 'closed') return;
    const rect = stage.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width - 0.5;
    const py = (e.clientY - rect.top) / rect.height - 0.5;
    tiltWrap.style.transform = `rotateY(${px * 14}deg) rotateX(${-py * 10}deg)`;
  }
  function resetTilt(){
    tiltWrap.style.transform = 'rotateY(0deg) rotateX(0deg)';
  }
  stage.addEventListener('mousemove', handleMove);
  stage.addEventListener('mouseleave', resetTilt);

  // scattered floating dots filling background space
  (function seedDots(){
    const backdrop = document.querySelector('.backdrop');
    const colors = COLORS;
    const n = 14;
    for(let i=0;i<n;i++){
      const d = document.createElement('div');
      d.className = 'dot';
      const size = 4 + Math.random()*7;
      d.style.width = size+'px';
      d.style.height = size+'px';
      d.style.left = Math.random()*100+'vw';
      d.style.top = Math.random()*100+'vh';
      d.style.background = colors[i % colors.length];
      d.style.opacity = (0.12 + Math.random()*0.15).toFixed(2);
      d.style.animationDuration = (5 + Math.random()*5)+'s';
      d.style.animationDelay = (Math.random()*4)+'s';
      backdrop.appendChild(d);
    }
  })();
</script>
</body>
</html>
